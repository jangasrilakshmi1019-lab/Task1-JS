<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyDashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f4f6f8;
    }

    /* Top Navbar */
    .navbar {
      height: 60px;
      background-color: #1f2a3a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .navbar .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
    }

    /* Layout */
    .container {
      display: flex;
      height: calc(100vh - 60px);
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #2f3f53;
      color: #fff;
      padding-top: 20px;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      padding: 15px 20px;
      cursor: pointer;
    }

    .sidebar ul li:hover {
      background-color: #3d516b;
    }

    /* Main Content */
    .main {
      flex: 1;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      background-color: #3bbaf5;
      color: #fff;
      height: 120px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* Responsive */
    @media (max-width: 1000px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <div class="navbar">
    <div class="logo">MyDashboard</div>
    <div class="menu">
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Logout</a>
    </div>
  </div>

  <!-- Page Layout -->
  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li>Dashboard</li>
        <li>Users</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </div>

    <!-- Main Content -->
    <div class="main">
      <div class="cards">
        <div class="card">Profile 1</div>
        <div class="card">Profile 2</div>
        <div class="card">Profile 3</div>
        <div class="card">Profile 4</div>
      </div>
    </div>

  </div>

</body>
</html>
