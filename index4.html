<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Techno IT</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
  background: linear-gradient(135deg, #081c3a, #0c2f5a);
  color: #fff;
  min-height: 100vh;
}


.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 60px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #2f8cff;
}

.logo span {
  color: #fff;
}

.nav-links a {
  margin: 0 15px;
  text-decoration: none;
  color: #fff;
  font-size: 14px;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 15px;
}

.btn {
  padding: 10px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-size: 13px;
}

.btn-primary {
  background: #2f8cff;
  color: #fff;
}

.btn-outline {
  background: transparent;
  border: 1px solid #2f8cff;
  color: #fff;
}


.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 60px;
  gap: 50px;
}

.hero-text {
  max-width: 50%;
}

.hero-text h1 {
  font-size: 44px;
  line-height: 1.2;
}

.hero-text h1 span {
  color: #2f8cff;
}

.hero-text p {
  margin: 20px 0;
  color: #cfd8e3;
  font-size: 15px;
  max-width: 500px;
}

.hero-buttons {
  display: flex;
  gap: 15px;
}


.hero-image {
  position: relative;
  width: 400px;
  height: 400px;
}

.hero-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 40px rgba(47,140,255,0.4));
}


.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: -1;
}


@media (max-width: 900px) {
  .hero {
    flex-direction: column;
    text-align: center;
  }

  .hero-text {
    max-width: 100%;
  }

  .hero-buttons {
    justify-content: center;
  }
}
</style>
</head>

  <div class="logo">techno<span>IT</span></div>

  <div class="nav-links">

    <a href="#">Testimonials</a>
    <a href="#">Team</a>
    <a href="#">News</a>
  </div>

    <button class="btn btn-primary">Get Quotes</button>
  </div>
</div>
