<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Grid Layout</title>

<style>
  body {
    margin: 0;
    background: #2c305b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  .grid-container {
    width: 900px;
    height: 500px;
    display: grid;

    /* Grid structure */
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;

    padding: 10px;
  }

  .item {
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-weight: bold;
    border-radius: 4px;
  }

  .green { background: #76c24e; }
  .red { background: #ef3b3b; }
  .yellow { background: #ffb938; }

  /* GRID PLACEMENTS */
  .item1 {
    grid-row: 1 / 4;
    grid-column: 1 / 2;
  }

  .item2 {
    grid-row: 1 / 2;
    grid-column: 2 / 3;
  }

  .item3 {
    grid-row: 1 / 2;
    grid-column: 3 / 4;
  }

  .item4 {
    grid-row: 2 / 3;
    grid-column: 2 / 3;
  }

  .item5 {
    grid-row: 2 / 3;
    grid-column: 3 / 4;
  }

  .item6 {
    grid-row: 3 / 4;
    grid-column: 2 / 3;
  }

  .item7 {
    grid-row: 3 / 4;
    grid-column: 3 / 4;
  }
</style>
</head>

<body>

<div class="grid-container">
  <div class="item item1 green">1</div>
  <div class="item item2 green">2</div>
  <div class="item item3 red">3</div>
  <div class="item item4 yellow">4</div>
  <div class="item item5 red">5</div>
  <div class="item item6 red">6</div>
  <div class="item item7 yellow">7</div>
</div>

</body> 
</html>
