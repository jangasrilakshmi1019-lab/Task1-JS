<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Grid Image Gallery</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    padding: 40px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 200px;
    gap: 15px;
    max-width: 1000px;
    margin: auto;
  }

  .gallery img {
    width: 90%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
  }

  
  .img1 {
    grid-column: 1 / 2;
    grid-row: 1 / 2;
  }

  .img2 {
    grid-column: 2 / 3;
    grid-row: 1 / 2;
  }

  .img3 {
    grid-column: 3 / 4;
    grid-row: 1 / 3;
  }

  .img4 {
    grid-column: 1 / 3;
    grid-row: 2 / 3;
  }

  .img5 {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
  }

  .img6 {
    grid-column: 3 / 4;
    grid-row: 3 / 4;
  }

  
  @media (max-width: 768px) {
    .gallery {
      grid-template-columns: 1fr;
      grid-auto-rows: 250px;
    }

    .gallery img {
      grid-column: auto !important;
      grid-row: auto !important;
    }
  }
</style>
</head>
