<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ball Animation</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to right, #1e3c72, #2a5298);
        overflow: hidden;
    }

    .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100px;
        background: #222;
    }

    .ball {
        width: 80px;
        height: 80px;
        background: radial-gradient(circle at 30% 30%, #ff4e50, #c31432);
        border-radius: 50%;
        position: absolute;
        bottom: 100px;
        animation: bounce 1s infinite ease-in-out alternate;
    }

    @keyframes bounce {
        0% {
            transform: translateY(0);
        }
        100% {
            transform: translateY(-300px);
        }
    }
</style>
</head>

<body>

<div class="ball"></div>
<div class="ground"></div>

</body>
</html>
